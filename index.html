<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Thala For A Reason</title>
		<script src="Thala.js"></script>
		<link rel="stylesheet" href="Thala.css" />
		<link rel="shortcut icon" href="assets/favicon.png" type="image/x-icon" />
	</head>

	<body class="bg">
		<div class="field flex">
			<h1 class="h-1">Everthing Happens For A Reason</h1>
			<input type="text" name="Thala" id="reasonInput" placeholder="Enter your Reason" autocomplete="off" />
			<button type="button" onclick="checkThala()" id="btn1">Check Thalavity</button><br />
			<a href="https://github.com/TheRealSamkit/ThalaForAReason" class="git">Made by &copy; Samkit Jain</a>
		</div>
		<div class="pop-up" id="successModal">
			<div class="popup-content">
				<span onclick="closeModal('successModal')" class="close">&times;</span>
				<p class="op">Congratulations 🥳</p>
				<video autoplay="" muted="" loop="" class="text-center">
					<source src="assets/yup.mp4" type="video/mp4" style="border-radius: 5px" />
				</video>
				<p id="output" class="output"></p>
			</div>
		</div>
		<div class="pop-up" id="failureModal">
			<div class="popup-content">
				<span onclick="closeModal('failureModal')" class="close">&times;</span>
				<p class="op">Sorry 😅</p>
				<img src="assets/noyup.jpg" alt="nothing" class="moye" />
				<p id="output2" class="output"></p>
			</div>
		</div>
		<script src="https://cdn.jsdelivr.net/npm/@tsparticles/confetti@3.0.3/tsparticles.confetti.bundle.min.js"></script>
	</body>
</html>
